<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 300" width="1260" height="300" role="img" aria-label="telegram-notify MCP">
  <title>telegram-notify MCP</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B222A"/>
      <stop offset="1" stop-color="#101418"/>
    </linearGradient>
  </defs>
  <g transform="translate(22 22) scale(0.5)">
  <rect x="3" y="3" width="506" height="506" rx="113" fill="url(#bg)" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="6"/>
    <!-- a paper plane on its way out: the server sends, and never reads back -->
    <g stroke-linecap="round" stroke-linejoin="round">
      <path d="M116 296 L170 254 M168 330 L206 300" fill="none" stroke="#93A3B5" stroke-width="16"/>
      <path d="M392 70 L132 161 L246 213 Z" fill="#3DB4F2" stroke="#151B21" stroke-width="12"/>
      <path d="M392 70 L246 213 L298 330 Z" fill="#1E8FD0" stroke="#151B21" stroke-width="12"/>
    </g>
    <!-- the letters MCP, drawn as strokes so no font is needed -->
    <g fill="none" stroke="#F4F4F0" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
      <path d="M142 432 V368 L174 408 L206 368 V432"/>
      <path d="M290.6 377.4 A32 32 0 1 0 290.6 422.6"/>
      <path d="M321 432 V368 H347 A20 20 0 0 1 347 408 H321"/>
    </g>
  </g>
  <text x="320" y="160" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="98" font-weight="800" letter-spacing="-3" fill="#101418">telegram<tspan fill="#3DB4F2" dx="2">-</tspan>notify <tspan font-weight="500" letter-spacing="0" fill="#7A8490">MCP</tspan></text>
  <text x="324" y="228" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="500" fill="#5B6470">Send-only Telegram notifications to one fixed chat</text>
</svg>
