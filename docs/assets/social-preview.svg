<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="telegram-notify — a send-only MCP server for Telegram notifications to one fixed chat">
  <title>telegram-notify MCP</title>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171D24"/>
      <stop offset="1" stop-color="#0C0F13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3DB4F2" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3DB4F2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F2730"/>
      <stop offset="1" stop-color="#12171C"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#page)"/>
  <circle cx="260" cy="300" r="300" fill="url(#glow)"/>

  <!-- icon -->
  <g transform="translate(100 150) scale(0.625)">
  <rect x="3" y="3" width="506" height="506" rx="113" fill="url(#bg)" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="6"/>
    <!-- a paper plane on its way out: the server sends, and never reads back -->
    <g stroke-linecap="round" stroke-linejoin="round">
      <path d="M116 296 L170 254 M168 330 L206 300" fill="none" stroke="#93A3B5" stroke-width="16"/>
      <path d="M392 70 L132 161 L246 213 Z" fill="#3DB4F2" stroke="#151B21" stroke-width="12"/>
      <path d="M392 70 L246 213 L298 330 Z" fill="#1E8FD0" stroke="#151B21" stroke-width="12"/>
    </g>
    <!-- the letters MCP, drawn as strokes so no font is needed -->
    <g fill="none" stroke="#F4F4F0" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
      <path d="M142 432 V368 L174 408 L206 368 V432"/>
      <path d="M290.6 377.4 A32 32 0 1 0 290.6 422.6"/>
      <path d="M321 432 V368 H347 A20 20 0 0 1 347 408 H321"/>
    </g>
  </g>

  <g font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="496" y="258" font-size="76" font-weight="800" letter-spacing="-2.5" fill="#F4F4F0">telegram<tspan fill="#3DB4F2">-</tspan>notify <tspan font-weight="500" fill="#8E99A5" letter-spacing="0">MCP</tspan></text>
    <text x="500" y="316" font-size="30" font-weight="500" fill="#C3CAD2">Send-only Telegram notifications to one fixed chat</text>
    <text x="500" y="368" font-size="31" font-weight="600" fill="#3DB4F2">Claude Code · Claude Desktop · any MCP client</text>

    <!-- feature chips -->
    <g font-size="22" font-weight="600" fill="#E6E9EC">
      <rect x="500" y="414" width="283" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <text x="641" y="443" text-anchor="middle">One fixed recipient</text>
      <rect x="797" y="414" width="182" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <text x="888" y="443" text-anchor="middle">Never polls</text>
      <rect x="993" y="414" width="157" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <text x="1071" y="443" text-anchor="middle">Two tools</text>
      <rect x="500" y="470" width="308" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <text x="654" y="499" text-anchor="middle">Files from one folder</text>
      <rect x="822" y="470" width="258" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <text x="951" y="499" text-anchor="middle">Open source · MIT</text>
    </g>

    <text x="500" y="574" font-size="22" font-weight="500" fill="#7F8A96">github.com/yybd/telegram-notify-mcp</text>
  </g>
</svg>
